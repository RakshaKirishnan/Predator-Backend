

services:

 
  mongo:
    image: mongo:7
    container_name: predator-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: predator
    volumes:
      - mongo_data:/data/db
    # No host port binding – backend reaches mongo via the internal Docker network.
    # To debug mongo from host: "127.0.0.1:27018:27017" (use 27018 to avoid conflict)
    networks:
      - predator-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: predator-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      FACE_AUTH_MONGO_URI: mongodb://mongo:27017
    ports:
      - "8090:8090"
    networks:
      - predator-net
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8090/auth/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - insightface_models:/home/appuser/.insightface

volumes:
  mongo_data:
    driver: local
  insightface_models:
    driver: local

networks:
  predator-net:
    name: predator-net
    driver: bridge
